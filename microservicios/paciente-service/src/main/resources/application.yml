spring:
  application:
    name: paciente-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
server:
  port: ${SERVER_PORT:8081}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
